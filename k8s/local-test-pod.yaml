# GrpcWorkbench local test: single workbench instance
#
# The pod runs:
#   - Web UI  (browser access)
#   - Built-in gRPC server (UDS — receives and displays incoming calls in its UI)
#
# Socket layout:
#   grpc-socket  →  mounted at /var/run/dds-ambassador
#
# Test flow:
#   Open http://localhost:30226
#     → create session with socket path: /var/run/dds-ambassador/grpc.sock
#     → upload proto → send a request to the built-in receiver
#
# Build:  docker build -t grpc-workbench:test .
# Deploy: kubectl apply -f k8s/local-test-pod.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: grpc-workbench-test
  labels:
    app: grpc-workbench-test
spec:
  containers:
    - name: grpc-workbench
      image: grpc-workbench:test
      imagePullPolicy: Never
      env:
        - name: UDS_SOCKET_PATH
          value: /var/run/dds-ambassador/grpc.sock
        - name: ASPNETCORE_URLS
          value: "http://+:5226"
      ports:
        - name: http
          containerPort: 5226
      volumeMounts:
        - name: grpc-socket
          mountPath: /var/run/dds-ambassador
      readinessProbe:
        httpGet:
          path: /health
          port: 5226
        initialDelaySeconds: 5
        periodSeconds: 3
        failureThreshold: 20

  volumes:
    - name: grpc-socket
      emptyDir: {}

  restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: grpc-workbench-test
spec:
  type: NodePort
  selector:
    app: grpc-workbench-test
  ports:
    - name: workbench
      port: 5226
      targetPort: 5226
      nodePort: 30226
