apiVersion: v1
kind: Namespace
metadata:
  name: signal-forge
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signal-forge-data
  namespace: signal-forge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-forge
  namespace: signal-forge
  labels:
    app.kubernetes.io/name: signal-forge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-forge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-forge
    spec:
      # DDS LAN discovery/multicast and unicast traffic must use the node NIC.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: signal-forge
          image: signal-forge:2026.08.30
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5226
              hostPort: 5226
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5226
            - name: DdsProfiles__StoragePath
              value: /app/data/dds-profiles.json
          envFrom:
            - secretRef:
                name: signal-forge-access
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: dds-shm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: signal-forge-data
        - name: dds-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: signal-forge
  namespace: signal-forge
spec:
  selector:
    app.kubernetes.io/name: signal-forge
  ports:
    - name: http
      port: 5226
      targetPort: http
      protocol: TCP
  type: ClusterIP
